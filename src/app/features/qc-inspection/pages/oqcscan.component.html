<ion-header>
  <ion-toolbar color="asp">
    <ion-buttons slot="start">
      <ion-button fill="clear"
                  [routerLink]="['/tabs/home']">
        <ion-icon slot="icon-only"
                  ios="chevron-back-outline"
                  md="arrow-back-outline">
        </ion-icon>
      </ion-button>
    </ion-buttons>
    <ion-title class="ion-text-center">
      OQC Scanner
    </ion-title>
  </ion-toolbar>
</ion-header>

<ion-content>
  <div class="form-row">

    <!-- Lệnh sản xuất -->
    <mat-form-field appearance="fill">
      <mat-label>Lệnh sản xuất</mat-label>
      <input matInput name="woDocNo" [(ngModel)]="model.woDocNo" 
      (focus)="openWOsFilterModal()" required>
      <button style="font-size: 18px;" mat-icon-button
        matSuffix>
        <mat-icon>clear</mat-icon>
      </button>
    </mat-form-field>

    <!-- Mã sản phẩm -->
    <mat-form-field appearance="fill">
      <mat-label>Mã sản phẩm</mat-label>
      <input matInput [ngModel]="model.productID" readonly>
    </mat-form-field>

    <!-- Nhân viên -->
    <mat-form-field appearance="fill">
      <mat-label>Tên nhân viên</mat-label>
      <input matInput name="techName" required [ngModel]="techName" readonly>
      <ion-button slotmediabutton slot="end" (click)="scanTechnicianQR()" [disabled]="isCompleted">
        <ion-icon name="scan-sharp"></ion-icon>
      </ion-button>
    </mat-form-field>

    <!-- KẾT QUẢ SCAN -->
    <div class="scan-result" *ngIf="scanResult">
      <ion-chip color="success" *ngIf="scanResult === 'OK'">
        <ion-icon name="checkmark-circle-outline"></ion-icon>
        <ion-label>OK</ion-label>
      </ion-chip>

      <ion-chip color="danger" *ngIf="scanResult === 'NG'">
        <ion-icon name="close-circle-outline"></ion-icon>
        <ion-label>NG</ion-label>
      </ion-chip>
    </div>
   
    <!-- Nút scan OK/NG -->
  <ion-grid>
    <ion-row>
      <ion-col size="6">
        <ion-button 
          expand="block" 
          size="large"
          color="success" 
          (click)="scanQRCode('OK')"
          [disabled]="isAutoScanActive && lastScanType !== 'OK'">
          <ion-icon slot="start" name="checkmark-circle"></ion-icon>
          Scan OK
        </ion-button>
      </ion-col>
      <ion-col size="6">
        <ion-button 
          expand="block" 
          size="large"
          color="danger" 
          (click)="scanQRCode('NG')"
          [disabled]="isAutoScanActive && lastScanType !== 'NG'">
          <ion-icon slot="start" name="close-circle"></ion-icon>
          Scan NG
        </ion-button>
      </ion-col>
    </ion-row>
  </ion-grid>

<!-- Hướng dẫn -->
  <ion-card *ngIf="!isAutoScanActive">
    <ion-card-content>
      <p class="ion-text-center ion-text-wrap">
        <ion-icon name="information-circle" color="primary"></ion-icon>
        Chọn chế độ scan (OK hoặc NG) để bắt đầu
      </p>
    </ion-card-content>
  </ion-card>
    <!-- NGUYÊN NHÂN NG – CHỈ HIỆN SAU KHI SCAN NG -->
    <mat-form-field appearance="fill"
                    *ngIf="scanResult === 'NG'">
      <mat-label>Nguyên nhân NG</mat-label>
      <textarea matInput
                [(ngModel)]="reasonNotes"
                placeholder="Nhập nguyên nhân NG"
                (ngModelChange)="validateSave()"
                [readonly]="isCompleted">
      </textarea>

      <mat-hint *ngIf="!reasonNotes">
        ⚠ Bắt buộc nhập nguyên nhân NG
      </mat-hint>
    </mat-form-field>

  </div>
</ion-content>
