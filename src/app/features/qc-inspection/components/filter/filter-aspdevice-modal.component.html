<ion-header>
  <ion-toolbar color="asp">
    <ion-buttons slot="start">
      <ion-button (click)="closeModal()" fill="clear">
        <ion-icon name="close-outline" size="large"></ion-icon>
      </ion-button>
    </ion-buttons>
    <ion-searchbar #searchBar [ngModel]="searchTerm" (ionChange)="onSearchChange($event)" cancelButtonIcon=""
      debounce="500" showCancelButton="never" placeholder="Tìm kiếm thiết bị...">
    </ion-searchbar>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true">
  <ng-container *ngIf="!loading; else skeletonTmpl">
    <ion-list class="mt-10">
      <ion-radio-group [(ngModel)]="radioModel">
        <ion-item *ngFor="let item of devices">
          <ion-label class="ion-text-wrap">
            <h3><b>{{item.ma_May}}</b> - {{item.ten_May}}</h3>
          </ion-label>
          <ion-radio [value]="item.ma_May" color="asp" slot="start" (click)="onChangeRadio(item)"></ion-radio>
        </ion-item>
      </ion-radio-group>
    </ion-list>

    <ion-infinite-scroll (ionInfinite)="loadMore($event)" [disabled]="devices.length >= allDevices.length">
      <ion-infinite-scroll-content loadingSpinner="bubbles" loadingText="Đang tải thêm thiết bị...">
      </ion-infinite-scroll-content>
    </ion-infinite-scroll>
  </ng-container>

  <ng-template #skeletonTmpl>
    <asp-skeleton></asp-skeleton>
  </ng-template>
</ion-content>
<ion-footer>
  <ion-button (click)="closeModal()">ĐÓNG</ion-button>
</ion-footer>
